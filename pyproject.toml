[project]
name = "task-swarm"
version = "0.1.0"
description = "A team of Claude agents, organized like a company, that finishes a task and checks its own work"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.80",
]

[project.scripts]
task-swarm = "taskswarm.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskswarm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
